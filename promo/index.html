<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Chain promo</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; color: #f4f2ec; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .headline { font-weight: 600; letter-spacing: -0.02em; line-height: 1.12; }

  /* 1. Hook */
  #s1 { background: #0b0b0c; }
  #typed { position: absolute; left: 150px; top: 640px; width: 1620px; font-size: 40px; line-height: 1.5; color: #9a9a97; word-break: break-all; }
  #typed b { color: #7ee787; font-weight: 500; }
  #hook { position: absolute; left: 150px; top: 330px; font-size: 136px; }

  /* 2. Finder */
  #s2 { background: #cfcdc6; }
  #cap2 { position: absolute; left: 110px; top: 96px; font-size: 96px; color: #0b0b0c; }
  .window { position: absolute; border-radius: 16px; overflow: hidden; box-shadow: 0 36px 90px rgba(0,0,0,.34), 0 0 0 1px rgba(0,0,0,.14); }
  .lights { position: absolute; left: 22px; top: 22px; display: flex; gap: 11px; }
  .lights i { width: 15px; height: 15px; border-radius: 50%; background: #8c8c88; }
  #finder { left: 110px; top: 300px; width: 1180px; height: 670px; background: #f6f5f1; color: #1b1b1c; }
  #finderbar { position: absolute; left: 0; right: 0; top: 0; height: 66px; border-bottom: 1px solid #dfddd6; }
  #finderbar span { position: absolute; left: 130px; top: 18px; font-size: 23px; font-weight: 600; }
  .folder { position: absolute; width: 170px; text-align: center; font-size: 21px; }
  .folder svg { display: block; margin: 0 auto 8px; width: 118px; height: 94px; }
  .folder.on span { background: #1b1b1c; color: #fff; border-radius: 6px; padding: 2px 9px; }

  .menu { position: absolute; background: rgba(36,36,38,.97); color: #f4f2ec; border-radius: 14px; padding: 9px 8px; box-shadow: 0 26px 70px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.12); }
  .row { position: relative; display: flex; align-items: center; border-radius: 7px; white-space: nowrap; }
  .row.hot { background: #f4f2ec; color: #0b0b0c; }
  .sep { height: 1px; background: rgba(255,255,255,.16); margin: 7px 10px; }
  #context { width: 370px; font-size: 22px; }
  #context .row { height: 38px; padding: 0 14px; }
  #context .row.dim { color: rgba(244,242,236,.92); }

  #term { left: 800px; top: 410px; width: 980px; height: 560px; background: #0d0e10; color: #e8e6df; font-size: 32px; }
  #term .title { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font-size: 20px; color: #8c8c88; font-family: -apple-system, sans-serif; }
  #termbody { position: absolute; left: 38px; top: 86px; right: 38px; line-height: 1.6; white-space: pre-wrap; }
  #termbody b { color: #7ee787; font-weight: 500; }
  .caret { display: inline-block; width: 18px; height: 34px; background: #e8e6df; vertical-align: -5px; }

  /* 3. Menu bar */
  #s3 { background: #111112; }
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 58px; background: #232325; border-bottom: 1px solid #39393b; }
  #baricon { position: absolute; left: 1216px; top: 6px; width: 62px; height: 46px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
  #baricon img { height: 30px; filter: invert(1); }
  #cap3 { position: absolute; left: 130px; top: 280px; font-size: 92px; }
  #sub3 { position: absolute; left: 134px; top: 548px; font-size: 38px; color: #a3a29d; font-weight: 400; }
  #names { position: absolute; left: 134px; top: 616px; width: 860px; height: 170px; font-size: 26px; line-height: 1.75; color: #6f6e6a; }
  #names span.lit { color: #e8e6df; }
  #barmenu { left: 1090px; top: 72px; width: 520px; font-size: 31px; padding: 13px 11px; transform-origin: 170px 0; }
  #barmenu .row { height: 56px; padding: 0 16px 0 58px; }
  #barmenu .row.off { color: rgba(244,242,236,.34); }
  #barmenu .head { height: 46px; padding: 0 16px; font-size: 24px; font-weight: 600; color: rgba(244,242,236,.5); }
  #barmenu .check, #barmenu .glyph { position: absolute; left: 16px; width: 28px; height: 28px; object-fit: contain; opacity: .92; }
  #barmenu .row.tick-off .check { display: none; }
  #barmenu .row.hot .check, #barmenu .row.hot .glyph { filter: invert(1); }

  /* 4. Light */
  #s4 { background: #f4f2ec; color: #0b0b0c; }
  #size { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 330px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  #size small { font-size: 150px; font-weight: 600; letter-spacing: -0.02em; margin-left: 28px; }
  #sub4 { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-size: 56px; font-weight: 500; }
  #sub4b { position: absolute; left: 0; right: 0; top: 750px; text-align: center; font-size: 36px; color: #6a6964; }

  /* 5. End */
  #s5 { background: #0b0b0c; }
  #logo { position: absolute; left: 50%; top: 240px; width: 300px; margin-left: -150px; }
  #name { position: absolute; left: 0; right: 0; top: 570px; text-align: center; font-size: 118px; font-weight: 700; letter-spacing: -0.03em; }
  #tag { position: absolute; left: 0; right: 0; top: 730px; text-align: center; font-size: 50px; color: #a3a29d; }

  #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 62px; z-index: 50; filter: drop-shadow(0 4px 7px rgba(0,0,0,.4)); opacity: 0; }
</style>
</head>
<body>
<section class="scene" id="s1">
  <div class="headline" id="hook">又要 cd 半天？</div>
  <div class="mono" id="typed"></div>
</section>

<section class="scene" id="s2">
  <div class="headline" id="cap2">右键。到了。</div>
  <div class="window" id="finder">
    <div id="finderbar"><div class="lights"><i></i><i></i><i></i></div><span>Developer</span></div>
    <div class="folder" style="left:70px;top:118px"><svg viewBox="0 0 118 94"><use href="#fold"/></svg><span>Notes</span></div>
    <div class="folder" id="target" style="left:290px;top:118px"><svg viewBox="0 0 118 94"><use href="#fold"/></svg><span>Chain</span></div>
    <div class="folder" style="left:510px;top:118px"><svg viewBox="0 0 118 94"><use href="#fold"/></svg><span>Website</span></div>
    <div class="folder" style="left:730px;top:118px"><svg viewBox="0 0 118 94"><use href="#fold"/></svg><span>Scripts</span></div>
    <div class="folder" style="left:70px;top:330px"><svg viewBox="0 0 118 94"><use href="#fold"/></svg><span>Archive</span></div>
  </div>
  <div class="menu" id="context">
    <div class="row">Open</div>
    <div class="row">Get Info</div>
    <div class="row">Rename</div>
    <div class="sep"></div>
    <div class="row" id="c-kitty">Open in kitty</div>
    <div class="row" id="c-ghostty">Open in Ghostty</div>
    <div class="row" id="c-otty">Open in Otty</div>
    <div class="row">New Note</div>
  </div>
  <div class="window mono" id="term">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="title">Ghostty — ~/Developer/Chain</div>
    <div id="termbody"></div>
  </div>
</section>

<section class="scene" id="s3">
  <div id="bar"><div id="baricon"><img src="assets/menubar.png" alt=""></div></div>
  <div class="headline" id="cap3">常用的三个，<br>放进右键菜单。</div>
  <div class="headline" id="sub3">支持 31 个终端和编辑器</div>
  <div id="names"></div>
  <div class="menu" id="barmenu"></div>
</section>

<section class="scene" id="s4">
  <div id="size">1.1<small>MB</small></div>
  <div id="sub4">只做一件事，所以很轻。</div>
  <div id="sub4b">住在菜单栏，不占 Dock，不开多余窗口。</div>
</section>

<section class="scene" id="s5">
  <img id="logo" src="assets/chain-icon.png" alt="">
  <div id="name">Chain</div>
  <div id="tag">右键，就到了。</div>
</section>

<svg width="0" height="0" style="position:absolute">
  <symbol id="fold" viewBox="0 0 118 94"><path d="M6 14a8 8 0 0 1 8-8h30l10 11h50a8 8 0 0 1 8 8v55a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z" fill="#2a2a2c"/></symbol>
</svg>
<svg id="cursor" viewBox="0 0 23 31"><path d="M2 2v23l6.2-5.6L12.5 29l4.2-1.9-4.3-9.3 8.2-.3z" fill="#0b0b0c" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>

<script>
const $ = (s) => document.querySelector(s);
const DURATION = 20;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const out = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

/* Sequential scene windows; each fades in over 0.25s at its start. */
const SCENES = [['#s1', 0, 3], ['#s2', 3, 9.5], ['#s3', 9.5, 14.5], ['#s4', 14.5, 17.5], ['#s5', 17.5, 20]];

function reveal(el, t, start, rise = 30, dur = .5) {
  const p = out(prog(t, start, start + dur));
  el.style.opacity = p;
  el.style.transform = `translateY(${(1 - p) * rise}px)`;
}

function pop(el, t, start, dur = .22) {
  const p = out(prog(t, start, start + dur));
  el.style.opacity = p;
  el.style.transform = `scale(${.94 + .06 * p})`;
}

/* Cursor path: [time, x, y], eased between stops. */
function cursorAt(t, path) {
  if (t <= path[0][0]) return path[0].slice(1);
  for (let i = 1; i < path.length; i++) {
    if (t <= path[i][0]) {
      const p = inOut(prog(t, path[i - 1][0], path[i][0]));
      return [path[i - 1][1] + (path[i][1] - path[i - 1][1]) * p, path[i - 1][2] + (path[i][2] - path[i - 1][2]) * p];
    }
  }
  return path[path.length - 1].slice(1);
}

const LONG_CD = 'cd ~/Developer/work/2026/clients/acme/projects/website/packages/frontend/src';
const NAMES = ['Terminal', 'iTerm2', 'Hyper', 'Alacritty', 'kitty', 'Warp', 'WezTerm', 'Tabby', 'Ghostty', 'Otty', 'Xcode', 'VS Code', 'Sublime Text', 'BBEdit', 'CotEditor', 'Zed', 'Cursor', 'Nova', 'Obsidian', 'PyCharm', 'WebStorm', 'GoLand', 'IntelliJ IDEA', 'Android Studio'];
$('#names').innerHTML = NAMES.map((n) => `<span>${n}</span>`).join(' &nbsp;·&nbsp; ');

/* The menu as it exists in the app today: apps are text + checkmark; actions carry an SF Symbol. */
const APPS = ['Terminal', 'iTerm2', 'kitty', 'Ghostty', 'Otty', 'Xcode', 'VS Code', 'Zed', 'Cursor', 'Obsidian'];
$('#barmenu').innerHTML = `
  <div class="row head" id="mhead"></div>
  ${APPS.map((a) => `<div class="row" data-app="${a}"><img class="check" src="assets/check.png" alt="">${a}</div>`).join('')}
  <div class="row" data-app="Custom Command"><img class="check" src="assets/check.png" alt="" style="display:none">Custom Command</div>
  <div class="sep"></div>
  <div class="row"><img class="glyph" src="assets/slider.png" alt="">Command Options…</div>
  <div class="sep"></div>
  <div class="row"><img class="glyph" src="assets/login.png" alt="">Launch at Login</div>
  <div class="row"><img class="glyph" src="assets/reload.png" alt="">Not Showing?</div>
  <div class="sep"></div>
  <div class="row"><img class="glyph" src="assets/power.png" alt="">Quit</div>`;

function seek(t) {
  for (const [id, a, b] of SCENES) {
    const on = t >= a && t < b + (b === DURATION ? 1 : 0);
    const el = $(id);
    el.style.opacity = on ? prog(t, a, a + .25) : 0;
    el.style.display = on ? 'block' : 'none';
  }
  const cur = $('#cursor');
  cur.style.opacity = 0;

  if (t < 3) {
    reveal($('#hook'), t, .15);
    const n = Math.floor(prog(t, .5, 2.75) * LONG_CD.length);
    $('#typed').innerHTML = `<b>~ ❯</b> ${LONG_CD.slice(0, n)}<span class="caret"></span>`;
  } else if (t < 9.5) {
    reveal($('#cap2'), t, 3.15);
    const finderIn = out(prog(t, 3.05, 3.5));
    $('#finder').style.opacity = finderIn;
    $('#finder').style.transform = `translateY(${(1 - finderIn) * 26}px)`;

    const clickRight = 4.35, clickItem = 5.9;
    $('#target').classList.toggle('on', t >= clickRight);
    const ctx = $('#context');
    ctx.style.left = '522px'; ctx.style.top = '540px';
    ctx.style.transformOrigin = '0 0';
    if (t >= clickRight && t < clickItem + .12) pop(ctx, t, clickRight + .05);
    else ctx.style.opacity = 0;
    const hover = t >= 5.45 && t < clickItem + .12;
    $('#c-ghostty').classList.toggle('hot', hover);

    const term = $('#term');
    term.style.transformOrigin = '30% 30%';
    if (t >= clickItem + .08) pop(term, t, clickItem + .08, .28); else term.style.opacity = 0;
    const lines = 'Last login: Thu Nov 5 on ttys004\n\n';
    const prompt = '<b>~/Developer/Chain ❯</b> ';
    const cmd = 'pwd';
    const k = Math.floor(prog(t, 6.9, 7.2) * cmd.length);
    let body = lines + prompt + cmd.slice(0, k);
    if (t >= 7.5) body += '\n/Users/you/Developer/Chain\n' + prompt;
    $('#termbody').innerHTML = body + '<span class="caret"></span>';

    if (t < 6.4) {
      cur.style.opacity = prog(t, 3.3, 3.5);
      const [x, y] = cursorAt(t, [[3.5, 1400, 900], [4.3, 515, 535], [5.0, 515, 535], [5.45, 800, 730], [6.1, 800, 730]]);
      cur.style.transform = `translate(${x}px, ${y}px)`;
    }
  } else if (t < 14.5) {
    reveal($('#cap3'), t, 9.7);
    reveal($('#sub3'), t, 10.15);
    reveal($('#names'), t, 10.4);
    const clickBar = 10.4, clickOtty = 12.2;
    $('#baricon').style.background = t >= clickBar ? 'rgba(255,255,255,.18)' : 'transparent';
    const menu = $('#barmenu');
    if (t >= clickBar) pop(menu, t, clickBar, .2); else menu.style.opacity = 0;

    /* Checking Otty fills the 3-app limit, so the app dims the rest, as it does for real. */
    const selected = new Set(['kitty', 'Ghostty']);
    if (t >= clickOtty) selected.add('Otty');
    $('#mhead').textContent = `Open In (${selected.size}/3)`;
    const full = selected.size >= 3;
    menu.querySelectorAll('[data-app]').forEach((r) => {
      const name = r.dataset.app;
      const isApp = name !== 'Custom Command';
      r.classList.toggle('tick-off', !selected.has(name));
      r.classList.toggle('off', isApp && full && !selected.has(name));
      r.classList.toggle('hot', name === 'Otty' && t >= 11.8 && t < clickOtty + .1);
    });

    const lit = Math.floor(prog(t, 10.5, 14.2) * NAMES.length);
    $('#names').querySelectorAll('span').forEach((s, i) => s.classList.toggle('lit', i < lit));

    cur.style.opacity = prog(t, 9.55, 9.75);
    const [x, y] = cursorAt(t, [[9.75, 1500, 620], [10.35, 1244, 30], [11.1, 1244, 30], [11.8, 1320, 366], [14.5, 1320, 366]]);
    cur.style.transform = `translate(${x}px, ${y}px)`;
  } else if (t < 17.5) {
    const p = out(prog(t, 14.55, 15.1));
    $('#size').style.opacity = p;
    $('#size').style.transform = `scale(${.9 + .1 * p})`;
    reveal($('#sub4'), t, 15.2);
    reveal($('#sub4b'), t, 15.6);
  } else {
    const p = out(prog(t, 17.6, 18.2));
    $('#logo').style.opacity = p;
    $('#logo').style.transform = `scale(${.9 + .1 * p})`;
    reveal($('#name'), t, 17.95);
    reveal($('#tag'), t, 18.3);
  }
}
window.seek = seek;
window.DURATION = DURATION;
seek(0);
if (!location.search.includes('render')) {
  const start = performance.now();
  (function tick() { seek(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(tick); })();
}
</script>
</body>
</html>
